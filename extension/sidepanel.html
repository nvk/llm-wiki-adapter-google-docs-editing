<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Wiki Google Docs Suggestions</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main>
    <p class="eyebrow">LLM WIKI</p>
    <h1>Google Docs suggestions</h1>
    <p class="lede">The local connector opens approved documents and applies revision-locked edits automatically.</p>
    <section class="card" aria-live="polite">
      <div class="status-row">
        <span id="status-dot" class="dot"></span>
        <strong id="status-title">Checking connector…</strong>
      </div>
      <p id="status-detail" class="detail"></p>
    </section>
    <p class="privacy">No interaction is required here. Document text is processed only for the active governed job and is never stored by the extension.</p>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
